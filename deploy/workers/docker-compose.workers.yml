# ═══════════════════════════════════════════════════════════
# StealthV26 — BullMQ Workers (additive compose overlay)
# ═══════════════════════════════════════════════════════════
#
# Usage:
#   docker compose -f docker-compose.prod.yml -f deploy/workers/docker-compose.workers.yml up -d --build
#
# Adds the workers service (telegram, compile, notify, relay queues)
# sharing the same image, Redis, and generated-scripts volume as the app.
#
services:
  workers:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waas-workers
    command: ["npm", "run", "workers"]
    env_file: .env.local
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DISABLE_REDIS: "false"
    volumes:
      - app_data:/app/data
      - app_generated:/app/public/generated-scripts
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"
