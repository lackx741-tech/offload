# ═══════════════════════════════════════════════════════════
# StealthV26 WaaS — Production Docker Compose
# ═══════════════════════════════════════════════════════════
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Architecture:
#   Nginx (host) → :3000 (app container) ← Railway Redis, Kafka, Indexer
#
# Redis is hosted on Railway — set REDIS_URL in .env.local.
# REDIS_URL from .env.local is passed through to all services that need it.
# The "data" volume preserves compile configs and generated scripts.

services:
  # ── Next.js App (Admin Panel + API) ────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waas-app
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env.local
    environment:
      NODE_ENV: production
      # REDIS_URL comes from .env.local (Railway Redis)
      # Do NOT override it here — env_file takes precedence when no conflict
      KAFKA_BROKERS: kafka:9092
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    volumes:
      - app_data:/app/data
      - app_generated:/app/public/generated-scripts
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M

  # ── Zookeeper (Kafka dependency) ───────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: waas-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk_data:/var/lib/zookeeper/data
      - zk_logs:/var/lib/zookeeper/log
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Kafka (Event Bus) ─────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: waas-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 3
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Blockchain Indexer ─────────────────────────────────
  indexer:
    build:
      context: .
      dockerfile: services/indexer/Dockerfile
    container_name: waas-indexer
    env_file: .env.local
    environment:
      # REDIS_URL comes from .env.local (Railway Redis)
      KAFKA_BROKERS: kafka:9092
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-https://eth.llamarpc.com}
      STEALTH_EXCHANGE_ADDRESS: ${STEALTH_EXCHANGE_ADDRESS:-}
      POLL_INTERVAL: ${POLL_INTERVAL:-30000}
    depends_on:
      kafka:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  zk_data:
    driver: local
  zk_logs:
    driver: local
  kafka_data:
    driver: local
  app_data:
    driver: local
  app_generated:
    driver: local
