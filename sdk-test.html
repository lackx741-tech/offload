<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stealth SDK Local Test</title>
  </head>
  <body style="background:#0b0b0f;color:white;font-family:system-ui;padding:24px">
    <h2>Stealth SDK Localhost Auto-Detect Test</h2>

    <div id="stealth-connect"></div>
    <pre id="out" style="white-space:pre-wrap"></pre>

    <script>
      const out = document.getElementById("out");

      const portsToTry = [3000, 3001, 3002, 3003, 3004, 3005, 3006, 3007, 3008, 3009, 3010];

      async function tryLoadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src;
          s.async = true;
          s.onload = () => resolve(s);
          s.onerror = () => {
            try { s.remove(); } catch (e) {}
            reject(new Error("Failed to load " + src));
          };
          document.head.appendChild(s);
        });
      }

      async function detectAndLoadSdk() {
        const errors = [];
        for (const p of portsToTry) {
          const base = `http://localhost:${p}`;
          const src = `${base}/api/sdk`;
          try {
            await tryLoadScript(src);
            return base;
          } catch (e) {
            errors.push(String(e && e.message ? e.message : e));
          }
        }
        throw new Error(
          "Could not load /api/sdk from localhost ports 3000-3010.\n" +
          "Make sure you ran npm run dev.\n\n" +
          errors.join("\n")
        );
      }

      async function main() {
        const base = await detectAndLoadSdk();
        out.textContent = `Detected SDK at: ${base}/api/sdk\n`;

        if (window.StealthSDK && typeof window.StealthSDK.init === "function") {
          try { await window.StealthSDK.init(); } catch (e) {}
        }

        window.StealthSDK.mountConnectButton("#stealth-connect");

        setInterval(() => {
          try {
            out.textContent =
              `Detected SDK at: ${base}/api/sdk\n\n` +
              JSON.stringify(window.StealthSDK.getState(), null, 2);
          } catch (e) {}
        }, 500);
      }

      main().catch(err => {
        out.textContent = String(err?.message || err);
      });
    </script>
  </body>
</html>
