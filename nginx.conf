# ──────────────────────────────────────────────────────────────────
# StealthV26 WaaS — Nginx reverse proxy config
#
# Install path:  /etc/nginx/sites-available/waas
# Enable:        ln -s /etc/nginx/sites-available/waas /etc/nginx/sites-enabled/
#
# Subdomain layout:
#   structure.v26sequence.com  — full Next.js frontend (admin panel, wallet)
#   api.v26sequence.com        — /api/* routes only (scripts, webhooks, relay)
#   af8.v26sequence.com        — affiliate portal only (/affiliate login + dashboard)
#   v26sequence.com / www      — silent 444 drop
#
# SSL cert (all subdomains on one cert):
#   certbot certonly --webroot -w /var/www/certbot \
#     -d structure.v26sequence.com \
#     -d api.v26sequence.com \
#     -d af8.v26sequence.com \
#     --register-unsafely-without-email --agree-tos --non-interactive
# ──────────────────────────────────────────────────────────────────

# ── Drop all HTTP connections to root domain ─────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name v26sequence.com www.v26sequence.com;
    return 444;
}

# ── Drop all HTTPS connections to root domain ────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name v26sequence.com www.v26sequence.com;

    ssl_certificate     /etc/letsencrypt/live/structure.v26sequence.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/structure.v26sequence.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 444;
}

# ── HTTP → HTTPS redirect for all active subdomains ─────────────
server {
    listen 80;
    listen [::]:80;
    server_name structure.v26sequence.com api.v26sequence.com af8.v26sequence.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — structure.v26sequence.com (full Next.js frontend) ────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name structure.v26sequence.com;

    ssl_certificate     /etc/letsencrypt/live/structure.v26sequence.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/structure.v26sequence.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;

    # Full Next.js app — auth handled by Next.js middleware
    location / {
        proxy_pass              http://127.0.0.1:3000;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_read_timeout      60s;
        proxy_send_timeout      60s;
        proxy_buffer_size       16k;
        proxy_buffers           4 32k;
        proxy_busy_buffers_size 64k;
        client_max_body_size    10M;
    }
}

# ── HTTPS — api.v26sequence.com (/api/* routes only) ────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.v26sequence.com;

    ssl_certificate     /etc/letsencrypt/live/structure.v26sequence.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/structure.v26sequence.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;

    # Affiliate embed script — public, cached, CORS open
    location /api/script {
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300, s-maxage=300" always;
    }

    # Generated script files — public, cached, CORS open
    location /generated-scripts/ {
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300, s-maxage=300" always;
    }

    # Telegram webhooks
    location /api/telegram/ {
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # All other /api/* routes
    location /api/ {
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Block everything that isn't /api/* — silent drop
    location / {
        return 444;
    }
}

# ── HTTPS — af8.v26sequence.com (affiliate portal only) ──────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name af8.v26sequence.com;

    ssl_certificate     /etc/letsencrypt/live/structure.v26sequence.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/structure.v26sequence.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;

    # Root → redirect to affiliate login
    location = / {
        return 302 https://af8.v26sequence.com/affiliate;
    }

    # Affiliate portal pages
    location ~ ^/affiliate(/.*)?$ {
        proxy_pass              http://127.0.0.1:3000;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_read_timeout      60s;
        client_max_body_size    10M;
    }

    # Affiliate API routes (login, config, compile)
    location ~ ^/api/affiliate(/.*)?$ {
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Auth session check
    location ~ ^/api/auth(/.*)?$ {
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js static assets
    location ~ ^/(_next|favicon\.ico|robots\.txt)(/.*)?$ {
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Block everything else — silent drop
    location / {
        return 444;
    }
}
