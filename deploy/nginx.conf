# ═══════════════════════════════════════════════════════════
# StealthV26 WaaS Platform — Nginx Reverse Proxy
# ═══════════════════════════════════════════════════════════
#
# Replace YOUR_DOMAIN with your actual domain.
# SSL certs managed by Certbot (Let's Encrypt).
#
# Prerequisite: Add to /etc/nginx/nginx.conf inside the http {} block:
#   limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
#   limit_req_zone $binary_remote_addr zone=script:10m rate=10r/s;
#
# Usage (handled by setup.sh):
#   1. Copy to /etc/nginx/sites-available/stealthv26
#   2. ln -s /etc/nginx/sites-available/stealthv26 /etc/nginx/sites-enabled/
#   3. sudo certbot --nginx -d YOUR_DOMAIN
#   4. sudo nginx -t && sudo systemctl reload nginx

upstream waas_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # SSL (Certbot will fill these in)
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain application/javascript application/json text/css application/xml text/xml;
    gzip_min_length 1000;

    # Max upload size (for config payloads)
    client_max_body_size 2m;

    # ── Health check (no rate limit, no logging) ─────────
    location = /api/health {
        proxy_pass http://waas_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── Dynamic script endpoint — CORS + edge cache ──────
    location /api/script {
        proxy_pass http://waas_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=script burst=15 nodelay;

        # Allow cross-origin for script embeds
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "public, max-age=300, s-maxage=300" always;

        # Handle preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # ── Relay endpoint — strict rate limit ───────────────
    location = /api/relay/batch {
        proxy_pass http://waas_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=api burst=5 nodelay;
        proxy_read_timeout 120s;
    }

    # ── API routes ───────────────────────────────────────
    location /api/ {
        proxy_pass http://waas_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=api burst=20 nodelay;
    }

    # ── Static assets — immutable cache ──────────────────
    location /_next/static/ {
        proxy_pass http://waas_backend;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable" always;
    }

    # ── Generated scripts (static files) ─────────────────
    location /generated-scripts/ {
        proxy_pass http://waas_backend;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=60" always;
    }

    # ── Next.js app (admin panel + catch-all) ────────────
    location / {
        proxy_pass http://waas_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
